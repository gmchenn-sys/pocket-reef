nt:space-between}.edge-copy{font-size:11px;line-height:1.5;max-width:70%;color:#222}button{font:12px Tahoma,"MS Sans Serif",Arial,"PingFang SC",sans-serif;cursor:pointer;touch-action:manipulation;color:#000}button:focus-visible,summary:focus-visible{outline:1px dotted #000;outline-offset:-4px}button:disabled{color:#808080;text-shadow:1px 1px white;cursor:default}.quiet,.link{padding:5px 10px;background:var(--face);border:2px solid;border-color:#fff #404040 #404040 #fff;min-height:29px;white-space:nowrap;box-shadow:1px 1px 0 #000}.quiet:active,.link:active{border-color:#404040 #fff #fff #404040;box-shadow:none;transform:translate(1px,1px)}.feedback{min-height:24px;margin:10px 0 8px;padding:3px 6px;background:#dfdfdf;border:1px solid;border-color:#808080 #fff #fff #808080;font-size:11px;color:#333}.feedback:empty:before{content:"就绪"}details{border:1px solid #808080;padding:0;margin-top:8px;box-shadow:inset 1px 1px 0 #fff}summary{cursor:pointer;list-style:none;font-size:11px;padding:6px 8px;display:flex;align-items:center;justify-content:space-between}summary::-webkit-details-marker{display:none}summary:after{content:"+";width:15px;height:15px;font:14px/13px "Courier New",monospace;text-align:center;border:1px solid;border-color:#fff #404040 #404040 #fff}details[open]>summary:after{content:"−"}.detail-body{padding:3px 8px 9px;font-size:11px;line-height:1.8}.detail-actions{display:flex;gap:8px;margin:10px 0}.fish-list{padding:0 8px}.fish-card{display:grid;grid-template-columns:82px 1fr auto;gap:6px;align-items:center;border-top:1px solid #a0a0a0;padding:7px 0}.ascii{font:13px "Courier New",monospace!important;white-space:pre;color:#222!important}.fish-name{font-size:11px}.fish-location{font-size:10px;color:#444}.instructions{font-size:11px;line-height:1.8}.instructions .link{margin-top:7px}footer{margin-top:10px;padding:3px 7px;font-size:10px;color:#333;border:1px solid;border-color:#808080 #fff #fff #808080;display:flex;justify-content:space-between}@media(max-width:48 <header><div class="title"><svg viewBox="0 0 44 30" aria-hidden="true"><path d="M5 15c6-9 17-9 25-1l8-5-1 13-8-6C20 24 11 22 5 15Z"/><path d="M6 16c6-7 16-8 22-2M16 9l4-5 5 5M18 21l4 4"/><circle cx="11" cy="13" r=".8"/></svg><h1>随身鱼缸</h1></div><span class="status off" id="connection">连接中</span></header>

<details><summary>靠近与连接</summary><div class="detail-body"><p>手机放在桌面屏幕右侧，靠近时开放相接的边缘。只有走到边缘的伙伴才会过去。</p><p>远近由信号估计，不是精确的触碰检测。可以在希望触发的位置记录一次。</p><div class="detail-actions"><button class="link" id="calibrateNear">记住这个距离</button><button class="link" id="resetNear">恢复自动判断</button></div><div class="instructions">连接 PocketReef 热点后使用。断开时，当前页面里的伙伴会留在手机；关掉或刷新页面需要重新连接。<br><button class="link" id="retry">重新连接</button></div></div></details>

<script>
// Classic Adafruit_GFX 5x7 glyph subset, identical to the device font.
const REEF_GLYPHS={" ":[0,0,0,0,0],".":[0,0,96,96,0],"-":[8,8,8,8,8],"_":[64,64,64,64,64],"(":[0,28,34,65,0],")":[0,65,34,28,0],"~":[2,1,2,4,2],"Y":[3,4,120,4,3],"o":[56,68,68,68,56],"<":[0,8,20,34,65],">":[0,65,34,20,8]};

class SnapshotOrder {
 constructor(){this.boot=null;this.last=-1;this.retired=new Set();}
 accept(snapshot){const boot=snapshot.boot??'legacy',seq=snapshot.seq??snapshot.serverMs??0;
  if(this.retired.has(boot))return {accepted:false,reset:false};
  const reset=this.boot!==boot;if(reset){if(this.boot!==null)this.retired.add(this.boot);this.boot=boot;this.last=-1;}
  if(seq<this.last)return {accepted:false,reset:false};this.last=seq;return {accepted:true,reset};
 }
}
// The two canvases clip complementary parts of this single body coordinate.
class SeamView {
  constructor(){this.state=null;this.offset=0;this.initialized=false;this.freezeProgress=null;}
  apply(value,serverMs,localNow){
    if(Number.isFinite(serverMs)){const offset=serverMs/1000-localNow;this.offset=this.initialized?this.offset*.8+offset*.2:offset;this.initialized=true;}
    this.state=value?.fish?value:null;this.freezeProgress=null;
  }
  active(){return this.state&&['offer','running','rollback'].includes(this.state.phase);}
  origin(){return -(this.state?.lead||0)/(this.state?.width||1);}
  progress(localNow){const s=this.state;if(!s)return 0;if(this.freezeProgress!==null)return this.freezeProgress;if(s.phase==='done')return 1;
    const elapsed=(localNow+this.offset)*1000-s.started,origin=this.origin();
    if(s.phase==='running')return Math.max(origin,Math.min(1,origin+elapsed/s.duration*(1-origin)));
    if(s.phase==='offer'&&s.lead>0)return Math.max(origin,Math.min(-8/s.width,origin+elapsed/s.duration*(1-origin)));
    if(s.phase==='rollback'){const t=Math.max(0,Math.min(1,elapsed/(s.rollbackDuration||500))),e=t*t*(3-2*t);return s.rollbackFrom+(origin-s.rollbackFrom)*e;}
    return origin;
  }
  pose(localNow,phone=true){const s=this.state,u=this.progress(localNow),w=s.width;
    const left=s.toPhone?(phone?-w+u*w:240-w+u*w):(phone?-u*w:240-u*w);
    return {x:left+(s.fish==='crab'?1:!phone&&s.fish==='octopus'?18:0),y:s.height,dir:s.phase==='rollback'?(s.toPhone?-1:1):s.toPhone?1:-1,vx:0,vy:0,seamControlled:true,entering:false,crossed:false};
  }
}
SeamView.SnapshotOrder=SnapshotOrder;
if(typeof module!=='undefined')module.exports=SeamView;

class NearApproach {
  constructor(){this.threshold=null;this.disarm();this.filtered=null;}
  disarm(){this.near=false;this.far=null;this.nearSince=null;this.leaveSince=null;this.samples=[];this.lastValid=0;this.reason='learning';this.closeLevel=-55;}
  update(raw,now){
    if(!Number.isFinite(raw)||raw>10||raw< -110){this.reason='no-signal';return this.near;}
    this.lastValid=now;this.samples.push(raw);if(this.samples.length>5)this.samples.shift();
    const sorted=this.samples.slice().sort((a,b)=>a-b),median=sorted[Math.floor(sorted.length/2)];
    this.filtered=this.filtered===null?median:this.filtered*.65+median*.35;
    this.far=this.far===null?this.filtered:Math.min(this.far,this.filtered);
    // Saturated close-range RSSI (including zero) must not set an unrealistically
    // strict exit threshold. Hand/orientation changes can vary many dB nearby.
    const enter=this.threshold===null?Math.min(-45,this.far+8):Math.min(-45,this.threshold);
    const leave=this.closeLevel;
    if(this.near){
      if(this.filtered<leave){if(this.leaveSince===null)this.leaveSince=now;if(now-this.leaveSince>=1000){this.near=false;this.nearSince=null;this.leaveSince=null;this.reason='far';}}
      else{this.leaveSince=null;this.reason='near';}
    }else if(this.filtered>=enter){
      if(this.nearSince===null)this.nearSince=now;
      if(now-this.nearSince>=1400){this.near=true;this.closeLevel=Math.min(-55,Math.min(-45,this.filtered)-8);this.leaveSince=null;this.reason='near';}
    }else{this.nearSince=null;this.reason='far';}
    return this.near;
  }
  fresh(now){return this.lastValid>0&&now-this.lastValid<ReefLink.FRESH_MS;}
}
// A missed heartbeat is not evidence that the phone moved away. Bound the
// grace period to the device lease; valid weak RSSI still closes independently.
class ReefLink {
  static FRESH_MS=6000;
  static REQUEST_MS=1800;
  constructor(){this.lastGood=null;this.failures=0;}
  received(now){this.lastGood=now;this.failures=0;}
  failed(){this.failures++;}
  live(now){return this.lastGood!==null&&now-this.lastGood<ReefLink.FRESH_MS;}
  status(now){return !this.live(now)?'offline':this.failures||now-this.lastGood>1200?'retrying':'connected';}
}
if(typeof module!=='undefined')module.exports=NearApproach;
if(typeof module!=='undefined')module.exports.ReefLink=ReefLink;

// Same 240x240 motion model as updateSwimmers/updateBottom on the ST7789.
class MobileWander {
  constructor(random=Math.random){this.random=random;this.positions={};this.food=[];this.feeding=null;this.eaten={};this.consumed=[];this.effects=[];this.foodId=0;this.seamEnabled=false;this.renderOffset=0;}
  pick(a,b){return a+Math.floor(this.random()*(b-a))}
  hit(list,x,y,h){return [...list].reverse().find(f=>{const p=this.positions[f.id];if(!p||p.crossed||p.seamControlled||p.seamWaiting)return false;const b=this.bounds(f,p,h);return x>=b.left-4&&x<=b.right+4&&y>=b.top-4&&y<=b.bottom+4;});}
  turn(id,t){const p=this.positions[id];if(!p||p.crossed||p.seamControlled||p.seamWaiting)return false;p.dir=-p.dir;p.edgeExit=false;p.entering=false;p.next=t+6;p.turnUntil=t+1.5;return true;}
  mouth(f,p,t,h){
    t+=this.renderOffset||0;
    if(f.id==='large'||f.id==='small'){const size=f.id==='large'?2:1,phase=f.id==='large'?.1:4.8;return{x:p.x+(p.dir>0?this.span(f)-2*size:0),y:p.y*h+Math.sin(t*.7+phase)*5+Math.sin(t*1.4+phase*1.3)*1.5+Math.sin(t*4+phase)*.4+3*size};}
    return{x:p.x+(f.id==='crab'?17:18),y:p.y*h+(f.id==='crab'?4:5)};
  }
  pickup(f,p,t,h){const mouth=this.mouth(f,p,t,h);if(f.id==='crab'||f.id==='octopus')return{x:p.x+(p.dir>0?34:2),y:mouth.y};return mouth;}
  feed(x,y,list,t,w,h){
    x=Math.max(14,Math.min(w-14,x));y=Math.max(16,Math.min(h-35,y));
    this.feeding={x,y,until:t+45};this.eaten={};
    for(let i=0;i<12;i++)this.food.push({id:++this.foodId,x:x+(this.random()-.5)*18,y:y+(this.random()-.5)*16,vx:(this.random()-.5)*22,sink:4+this.random()*7,phase:this.random()*6.28,age:0});
    this.food=this.food.slice(-48);
    for(const f of list){const p=this.positions[f.id];if(p&&!p.crossed){p.target=null;p.next=0;}}
  }
  particles(list,dt,t,w,h){
    const alive=[];
    for(const q of this.food){q.age+=dt;
      if(q.swallow){const f=list.find(f=>f.id===q.swallow),p=f&&this.positions[f.id];
        if(!p||p.crossed){q.swallow=null;q.claim=null;}
        else{const mouth=this.mouth(f,p,t,h),blend=1-Math.exp(-dt*22);q.x+=(mouth.x-q.x)*blend;q.y+=(mouth.y-q.y)*blend;
          if(t>=q.goneAt){this.eaten[f.id]=(this.eaten[f.id]||0)+1;this.consumed.push({id:q.id,by:f.id,t});p.biteUntil=t+.17;p.chewing=false;p.cooldown=t+.65+this.random()*.4;p.target=null;this.effects.push({x:mouth.x,y:mouth.y,t,dir:p.dir});continue;}}
      }
      if(!q.swallow){q.vx*=Math.exp(-dt*.75);q.x+= (q.vx+Math.sin(t*.65+q.phase)*2.5)*dt;q.y=Math.min(h-15,q.y+q.sink*dt);q.x=Math.max(8,Math.min(w-8,q.x));}
      if(q.age<45)alive.push(q);
    }
    this.food=alive;this.effects=this.effects.filter(e=>t-e.t<.45);
    if(!this.food.length)this.feeding=null;
  }
  targets(list,t,w,h){
    for(const q of this.food)q.claim=q.swallow||null;
    const eligible=list.filter(f=>{const p=this.positions[f.id];return p&&!p.crossed&&!p.seamControlled&&!p.seamWaiting&&!p.entering&&!p.edgeExit&&t>=(p.detourUntil||0);});
    const unfed=list.filter(f=>!this.eaten[f.id]&&!this.positions[f.id]?.crossed).length;this.waitingFor=unfed;
    for(const f of eligible.sort((a,b)=>(this.eaten[a.id]||0)-(this.eaten[b.id]||0))){const p=this.positions[f.id];
      if(t<(p.cooldown||0))continue;
      if(this.eaten[f.id]&&this.food.filter(q=>!q.swallow&&!q.claim).length<=unfed)continue;
      let q=this.food.find(q=>q.id===p.target&&!q.swallow&&!q.claim);
      if(q&&t-(p.targetAt||0)>6)q=null;
      if(!q){const free=this.food.filter(q=>!q.swallow&&!q.claim);if(this.eaten[f.id]&&free.length<=unfed)continue;const mouth=this.mouth(f,p,t,h);free.sort((a,b)=>Math.hypot(a.x-mouth.x,a.y-mouth.y)-Math.hypot(b.x-mouth.x,b.y-mouth.y));q=free[0];if(q){p.target=q.id;p.targetAt=t;p.targetDir=q.x<this.span(f)+12?-1:q.x>w-this.span(f)-12?1:q.x>p.x+this.span(f)/2?1:-1;}}
      if(q){q.claim=f.id;p.feedGoal=q;}else p.target=null;
    }
  }
  span(f){return f.id==='large'?84:f.id==='small'?42:f.id==='octopus'?36:38}
  enter(f,w,h){this.positions[f.id]={x:-this.span(f)-6,y:f.id==='crab'?220/240:Math.max(.1,Math.min(.8,f.entryY||.5)),dir:1,entering:true,vx:f.id==='crab'?20:17,vy:0,next:0,crossed:false};}
  cancel(id){const p=this.positions[id];if(!p)return;p.crossed=false;p.seamWaiting=false;p.seamPreparing=false;p.seamControlled=false;p.edgeExit=false;p.entering=true;p.dir=1;p.next=0;}
  bounds(f,p,h,x=p.x,y=p.y){return {left:x+(f.id==='crab'?-1:0),right:x+this.span(f)-(f.id==='crab'?1:0),top:f.id==='crab'?y*h:y*h+(f.id==='octopus'?-17:-10),bottom:f.id==='crab'?y*h+15:y*h+(f.id==='large'?27:f.id==='small'?19:17)};}
  room(f,p,x,y,list,w,h){const a=this.bounds(f,p,h,x,y);if(a.right<0||a.left>=w)return true;const reserve=this.seamReservation;if(reserve&&reserve.id!==f.id&&a.left<reserve.right+6&&a.right+6>reserve.left&&a.top<reserve.bottom+6&&a.bottom+6>reserve.top)return false;for(const other of list){if(other.id===f.id)continue;const q=this.positions[other.id];if(!q||q.crossed)continue;const b=this.bounds(other,q,h);if(b.right<0||b.left>=w)continue;if(a.left<b.right+6&&a.right+6>b.left&&a.top<b.bottom+6&&a.bottom+6>b.top)return false;}return true;}
  step(list,dt,t,w,h,open,pendingId=null){
    const current=new Set(list.map(f=>f.id));for(const id of Object.keys(this.positions))if(!current.has(id))delete this.positions[id];
    for(const f of list)if(!this.positions[f.id])this.enter(f,w,h);
    const desired={};
    this.particles(list,dt,t,w,h);
    const feeding=!!this.feeding&&this.food.length>0;
    for(const p of Object.values(this.positions)){p.feedGoal=null;p.feedDx=null;p.chewing=false;}
    // Departure wins over feeding, including on the frame an animal touches the edge.
    for(const f of list){const p=this.positions[f.id];if(!open)p.edgeExit=false;else if(!p.entering&&p.dir<0&&this.bounds(f,p,h,p.x-p.vx*dt).left<=0)p.edgeExit=true;}
    if(feeding)this.targets(list,t,w,h);
    for(const f of list){const p=this.positions[f.id];if(p.seamControlled||p.seamWaiting)continue;
      if(p.crossed){if(!open&&pendingId!==f.id)this.cancel(f.id);continue;}
      // Once a resident reaches the shared edge heading out, finish that exit.
      // Feeding and a scheduled random turn cannot pull a half-departed body back.
      if(!open)p.edgeExit=false;
      else if(!p.entering&&p.dir<0&&this.bounds(f,p,h,p.x-p.vx*dt).left<=0)p.edgeExit=true;
      const crab=f.id==='crab',oct=f.id==='octopus',speed=crab?20:f.id==='large'?17:f.id==='small'?15:13;
      if(!p.next||t>=p.next){
        // Pick a cruising heading only once per long leg. Never chase an X target
        // or reverse because avoidance temporarily blocked horizontal movement.
        if(!p.edgeExit&&!feeding&&!p.entering&&(p.next&&p.x>8&&p.x+this.span(f)<w-8)&&this.pick(0,3)===0)p.dir=-p.dir;
        p.vx=crab?this.pick(18,29):speed*(.85+this.pick(0,31)/100);
        let y=this.pick(oct?28:24,oct?203:183);if(f.id==='large')y=y*.4+145*.6;if(f.id==='small')y=y*.4+70*.6;
        p.ty=y/h;p.next=t+(crab?this.pick(3500,8000):this.pick(4500,10000))/1000;
      }
      desired[f.id]=crab?Math.max(-20,Math.min(20,(220-p.y*h)*.8)):Math.max(-8,Math.min(8,(p.ty-p.y)*h*.35));
      p.dining=false;
      const q=p.feedGoal;
      if(q&&!p.entering&&!p.edgeExit){
        if(t>=(p.turnUntil||0))p.dir=p.targetDir;
        const mouth=this.pickup(f,p,t,h),dx=q.x+Math.sin(q.phase)*.5-mouth.x,dy=q.y-mouth.y;
        p.feedDx=Math.max(-35,Math.min(35,dx*1.55));desired[f.id]=Math.max(-25,Math.min(25,dy*1.4));p.next=t+2;

 for(const f of list){const p=positions[f.id];if(p&&!p.crossed)drawCreature(f,{...p,biteUntil:p.biteUntil?p.biteUntil+seamView.offset:0},sceneT)}
 for(const food of motion.food){ctx.globalAlpha=Math.max(0,Math.min(1,(45-food.age)/3));pixel(food.x,food.y,'#e2d98b');if(!food.swallow)pixel(food.x+1,food.y+1,'#e2d98b');}ctx.globalAlpha=1;
 for(const effect of motion.effects){const age=(t-effect.t)/.45,d=3+age*5;line(effect.x-effect.dir*d,effect.y-2,effect.x-effect.dir*(d+2),effect.y-3,'#52605c');}
 if(events.length)returnAtEdge(events[0]);
 requestAnimationFrame(draw)}
let press=null;
canvas.style.touchAction='manipulation';
canvas.addEventListener('pointerdown',e=>{press={x:e.clientX,y:e.clientY};});
canvas.addEventListener('pointerup',e=>{if(!press||Math.hypot(e.clientX-press.x,e.clientY-press.y)>10){press=null;return;}press=null;const box=canvas.getBoundingClientRect(),x=(e.clientX-box.left)*240/box.width,y=(e.clientY-box.top)*240/box.height,t=performance.now()/1000,list=animals().filter(f=>f.owner==='phone'),hit=motion.hit(list,x,y,height);if(hit){motion.turn(hit.id,t);say(`${names[hit.id]}转身了。`)}else if(list.length){motion.feed(x,y,list,t,width,height);say('撒下一小撮，慢慢吃。')}else say('手机鱼缸还没有伙伴，先接几位过来。');});
canvas.addEventListener('pointercancel',()=>{press=null;});
restoreResidents();render();refresh();requestAnimationFrame(draw);setInterval(()=>{if(seamView.active()||Date.now()-(lastPoll)>260){lastPoll=Date.now();refresh()}},100);setInterval(savePositions,3000);
addEventListener('online',refresh);addEventListener('pagehide',()=>{savePositions();closePortal()});document.addEventListener('visibilitychange',()=>{if(document.hidden){savePositions();closePortal()}else refresh()});
})();
